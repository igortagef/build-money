# Nginx — coloca o Build Money no ar sob o seu subdomínio, encaminhando para o
# app Node.js que roda na porta 3000. O certbot (SSL) ajusta este arquivo
# automaticamente para adicionar o HTTPS.
#
# 1) Troque "app.suaempresa.com.br" pelo seu subdomínio real (2 lugares).
# 2) Salve em: /etc/nginx/sites-available/build-money
# 3) Ative:    ln -s /etc/nginx/sites-available/build-money /etc/nginx/sites-enabled/
# 4) Teste:    nginx -t   e recarregue:  systemctl reload nginx
# 5) SSL:      certbot --nginx -d app.suaempresa.com.br

server {
    listen 80;
    listen [::]:80;
    server_name app.suaempresa.com.br;

    # Limite generoso para envio de fotos (perfil/bens) via formulário.
    client_max_body_size 5M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
